<!-- =====================================================================
  Template Supabase Auth « Magic Link » — charte Carnet de Pêche.
  À coller dans Dashboard → Authentication → Email Templates → Magic Link
  (cf README.md de ce dossier). Les {{ .XXX }} sont des variables Go
  remplacées par Supabase à l'envoi — ne pas les toucher.
  Le lien utilise {{ .TokenHash }} (PAS {{ .ConfirmationURL }}) → flux
  token_hash + verifyOtp via /auth/confirm, robuste cross-device.
  type=email (et NON magiclink, déprécié) : c'est le type de vérification
  d'un OTP/lien envoyé par email pour le sign-in (cf docstring verifyOtp).
====================================================================== -->
<html lang="fr">
  <body style="background-color:#FBF8F2;margin:0;font-family:Arial,sans-serif;">
    <div style="max-width:480px;margin:0 auto;padding:32px 16px;">
      <p style="font-size:18px;font-weight:bold;color:#0A2F3D;margin:0 0 16px;">
        📒 Carnet de Pêche
      </p>
      <div style="background-color:#ffffff;border-radius:14px;padding:28px;border:1px solid #e5e7eb;">
        <p style="font-size:20px;font-weight:bold;color:#0A2F3D;margin:0 0 16px;">
          Ton lien de connexion
        </p>
        <p style="font-size:15px;line-height:24px;color:#0E1A22;margin:0 0 16px;">
          Connecte-toi au compte <strong>{{ .Email }}</strong> en un clic — le
          lien est valable 1&nbsp;heure.
        </p>
        <p style="margin:0 0 24px;">
          <a
            href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/home"
            style="display:inline-block;background-color:#14B8A6;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;padding:12px 24px;border-radius:12px;"
            >Me connecter</a
          >
        </p>
        <p style="font-size:13px;color:#5b6b73;margin:0;">
          Tu n&rsquo;es pas à l&rsquo;origine de cette demande ? Ignore simplement cet
          email — personne ne peut se connecter sans ce lien.
        </p>
      </div>
      <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0 12px;" />
      <p style="font-size:12px;color:#5b6b73;margin:0;">
        Carnet de Pêche · Logue. Partage. Progresse.
      </p>
    </div>
  </body>
</html>
