name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 10 : aligné sur le poste de dev (lockfile généré en 10.x).
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint BLOQUANT (sprint 11.5) : config flat réalignée (eslint-config-next 15
      # + FlatCompat) et dette lint soldée → plus de continue-on-error.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
