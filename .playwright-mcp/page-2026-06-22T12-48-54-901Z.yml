          - generic [ref=e467]:
            - heading "Description" [level=2] [ref=e468]
            - paragraph [ref=e469]: "L'estacade de Châtelaillon, c'est la jetée du front de mer qui s'avance sur l'estran sableux au centre de la station, en contrebas du casino. Tu pêches depuis la structure ou sur le sable autour : au surfcasting sur le coup de marée montante pour le bar et la dorade royale (la baie de Châtelaillon est un bon coin à dorade en été), à la flottante ou au flotteur coulissant pour l'orphie quand l'eau remonte le long des pieux. Les maquereaux et les orphies passent par bancs de mai à septembre ; le bar mord bien à la tombée du jour et de nuit, l'estacade restant éclairée. Joue les marées de coefficient moyen à fort : ici l'estran se découvre sur 200 à 300 m aux grandes marées."
          - generic [ref=e470]:
            - heading "Accès" [level=2] [ref=e471]
            - paragraph [ref=e472]: "Accès à pied direct depuis la promenade du front de mer, centre-ville de Châtelaillon (parkings le long de l'avenue de la falaise et près du casino, gratuits hors saison). Le meilleur poste est l'extrémité de la jetée à mi-marée montante, ou le sable juste au sud de la structure. Attention : en été, respecte les zones de baignade balisées par bouées jaunes (amende 135 €) et reste à l'écart des bouchots à coquillages au sud (interdiction de pêche à moins de 50 m des concessions). Aux grandes marées (coef > 100, marnage 5 m+) la mer remonte vite sur l'estran plat — surveille le retour d'eau pour ne pas te faire piéger. Sol vaseux et pieux glissants : chaussures qui accrochent recommandées."
