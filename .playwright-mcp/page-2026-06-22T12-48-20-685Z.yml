          - paragraph [ref=e23]: "Le bar est LE poisson du bord en France : présent de Dunkerque à Menton, il chasse dans 50 cm d'eau comme le long des digues. Assez accessible pour ton premier poisson au leurre, assez malin pour t'obséder vingt ans — c'est lui qui remplit les carnets des pêcheurs du bord."
