      - generic [ref=e39]:
        - generic [ref=e40]:
          - generic [ref=e41]:
            - paragraph [ref=e42]: "Quatre techniques le prennent du bord, et aucune autre de nos espèces n'offre ça : leurre souple raclé sur une pointe battue, arénicole posée dans une baïne à 2 h du matin, lançon vivant dérivé dans la veine de courant, crevette sous un flotteur le long d'un quai. Un 45 cm te semblera énorme la première année ; un 70 cm+ reste un événement qu'on raconte encore dix ans après. En Méditerranée on l'appelle loup — même poisson, mais éduqué par l'eau claire et la pression de pêche."
            - paragraph [ref=e43]: "Le bar ne se donne pas : il impose de lire la marée, le vent et la lumière, puis de revenir au bon créneau. C'est aussi l'espèce la plus encadrée de nos côtes — maille, quota, fermeture hivernale, marquage — alors lis la réglementation ci-dessous avant de garder ton premier poisson."
