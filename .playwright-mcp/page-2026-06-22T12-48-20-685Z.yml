          - generic [ref=e150]:
            - heading "Où se poster selon les conditions" [level=2] [ref=e151]
            - paragraph [ref=e152]: "Le bar aime l'eau qui bouge. Sur la façade Manche-Atlantique, cale ta session sur la marée de TON spot, pas sur ta montre : les deux dernières heures de montante et la première de descendante concentrent l'essentiel des touches, surtout quand le courant se rétablit après l'étale. Les coefficients moyens à forts (70-95) brassent juste ce qu'il faut ; au-delà de 100, courant et turbidité compliquent la présentation. La courbe de marée et les horaires de pleine et basse mer de chaque spot sont dans l'app — croise-les avec tes propres prises."
            - paragraph [ref=e153]: "Côté météo, fuis la mer d'huile sous grand soleil. Un vent de mer de 15 à 25 km/h qui teinte l'eau et forme un peu d'écume met les bars en confiance ; pour le surfcasting, une houle de 1 à 1,5 m qui creuse les baïnes vaut dix sessions sur mer plate. Le créneau en or : 24 à 48 h après un coup de vent, quand l'eau commence à clarifier et que les embouchures regorgent de nourriture déterrée."
            - paragraph [ref=e154]: "Les postes qui paient : pointes rocheuses battues où la veine de courant accélère, sorties de parcs ostréicoles, baïnes et sorties d'eau des plages océanes la nuit, quais et pontons à l'ombre des coques dans les ports. En Méditerranée, vise les digues, les graus et les sorties d'eau douce, surtout pendant et juste après un coup d'est. Partout, la même règle : l'aube et le crépuscule écrasent le reste de la journée."
            - paragraph [ref=e155]:
              - text: Chaque fiche spot de
              - link "la carte" [ref=e156] [cursor=pointer]:
                - /url: /carte
              - text: affiche la courbe de marée du jour, le vent et la houle — de quoi choisir ton poste avant de charger la voiture.
